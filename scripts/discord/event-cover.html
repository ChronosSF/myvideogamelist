<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
    The source of assets/event-cover.jpg: the cover of the Discord event for the open test. 800 by 320,
    drawn at twice that by draw.mjs, with the app's tokens, fonts and pixel matrix, as welcome.html
    beside it is.
-->
<style>
    @font-face {
        font-family: 'Archivo Display';
        font-weight: 800;
        src: url('../../myvideogamelist.client/src/assets/fonts/archivo-display-latin.woff2') format('woff2');
    }
    @font-face {
        font-family: 'Archivo Title';
        font-weight: 700;
        src: url('../../myvideogamelist.client/src/assets/fonts/archivo-title-latin.woff2') format('woff2');
    }
    @font-face {
        font-family: 'DM Mono';
        font-weight: 400;
        src: url('../../myvideogamelist.client/node_modules/@fontsource/dm-mono/files/dm-mono-latin-400-normal.woff2') format('woff2');
    }
    @font-face {
        font-family: 'DM Mono';
        font-weight: 500;
        src: url('../../myvideogamelist.client/node_modules/@fontsource/dm-mono/files/dm-mono-latin-500-normal.woff2') format('woff2');
    }

    * { box-sizing: border-box; }
    p, h1 { margin: 0; }

    html, body {
        width: 800px;
        height: 320px;
        margin: 0;
        overflow: hidden;
    }

    body {
        position: relative;
        padding: 30px 36px;
        background: var(--color-page);
    }

    .pattern, .pattern-lit { position: absolute; inset: 0; pointer-events: none; }
    .pattern {
        background:
            radial-gradient(70% 120% at 78% 0%, color-mix(in srgb, var(--color-primary-500) 34%, transparent), transparent 70%),
            color-mix(in srgb, var(--color-primary-500) 9%, transparent);
        -webkit-mask-image: url('../../myvideogamelist.client/src/assets/dot-matrix.svg'), linear-gradient(to bottom, #000 0%, #000 55%, transparent 100%);
        -webkit-mask-size: 8px 8px, 100% 100%;
        -webkit-mask-repeat: repeat, no-repeat;
        -webkit-mask-composite: source-in;
        mask-composite: intersect;
    }
    .pattern-lit {
        background: color-mix(in srgb, var(--color-primary-500) 55%, transparent);
        -webkit-mask-image: url('../../myvideogamelist.client/src/assets/dot-matrix-lit.svg'), linear-gradient(to bottom, #000 0%, #000 55%, transparent 100%);
        -webkit-mask-size: 640px 480px, 100% 100%;
        -webkit-mask-repeat: repeat, no-repeat;
        -webkit-mask-composite: source-in;
        mask-composite: intersect;
    }

    .text { position: relative; width: 400px; }

    .lockup {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--color-fg-strong);
        font-family: 'Archivo Title', sans-serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
    }
    .lockup svg { width: 32px; height: 32px; }
    .logo-tile { fill: var(--color-brand-navy); }
    .logo-play { fill: var(--color-brand-light); stroke: var(--color-brand-light); }
    .logo-badge { fill: var(--color-brand-lime); }
    .logo-check { stroke: var(--color-brand-navy); }
    .brand-accent { color: var(--color-brand-lime); }

    h1 {
        margin-top: 24px;
        color: var(--color-fg-strong);
        font-family: 'Archivo Display', sans-serif;
        font-size: 40px;
        font-weight: 800;
        line-height: 0.98;
        letter-spacing: -0.02em;
    }
    h1 .accent { color: var(--color-primary-400); }

    .where {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 26px;
        color: var(--color-fg-strong);
        font-family: 'DM Mono', monospace;
        font-size: 14px;
        letter-spacing: 0.04em;
    }
    .tag {
        padding: 6px 10px 5px;
        background: var(--color-primary-500);
        color: var(--color-page);
        font-weight: 500;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        border-radius: 2px;
    }

    .screen {
        position: absolute;
        left: 436px;
        top: 38px;
        width: 480px;
        aspect-ratio: 1200 / 750;
        border: 1px solid var(--color-line-strong);
        border-radius: 3px;
        overflow: hidden;
        box-shadow: 0 18px 46px rgb(0 0 0 / 0.62), 0 3px 10px rgb(0 0 0 / 0.5);
    }
    .screen img, .phone img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top left; }
    .phone {
        position: absolute;
        right: 26px;
        top: 86px;
        width: 108px;
        aspect-ratio: 390 / 800;
        padding: 4px;
        border: 1px solid var(--color-line-strong);
        border-radius: 12px;
        background: var(--color-sunken);
        box-shadow: 0 18px 46px rgb(0 0 0 / 0.7), 0 3px 10px rgb(0 0 0 / 0.55);
    }
    .phone img { border-radius: 8px; }
</style>
</head>
<body>
    <div class="pattern"></div>
    <div class="pattern-lit"></div>

    <div class="screen"><img data-shot="game" alt=""></div>
    <div class="phone"><img data-shot="phone" alt=""></div>

    <div class="text">
        <div class="lockup">
            <svg viewBox="0 0 64 64" aria-hidden="true">
                <mask id="logo-gap">
                    <rect width="64" height="64" fill="white"/>
                    <rect x="37" y="-3" width="30" height="30" rx="11" fill="black"/>
                </mask>
                <g mask="url(#logo-gap)">
                    <rect class="logo-tile" y="8" width="56" height="56" rx="15"/>
                    <path class="logo-play" d="M21 26 40 36 21 46Z" stroke-width="6" stroke-linejoin="round"/>
                </g>
                <rect class="logo-badge" x="40" width="24" height="24" rx="8"/>
                <path class="logo-check" d="M45.5 12 49.5 16 58 7" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>MyVideoGame<span class="brand-accent">List</span></span>
        </div>
        <h1>Every game<br>you&rsquo;ve played,<br><span class="accent">in one list</span></h1>
        <div class="where">
            <span class="tag">Open test</span>
            <span>dev.myvideogamelist.net</span>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <!--
        What the distribution answers, with a 404, for any address the bucket has nothing at (ADR 0066).
        It is also an object in the bucket, so /404.html itself answers 200; the noindex is for that
        address, and no canonical URL goes with it, since the two together say different things.
        Every link is from the root, because this page is served at whatever address was asked for.

        It says nothing about the test run (ADR 0100), so it does not change when the test run ends.
    -->
    <title>Page not found - MyVideoGameList</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Each face draws part of the first screen; index.html says why crossorigin. -->
    <link rel="preload" href="/fonts/archivo-display-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/archivo-title-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/schibsted-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/dm-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="page-pattern" aria-hidden="true"></div>

    <header class="site-header">
        <div class="wrap">
            <a class="brand" href="/">
                <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
                    <mask id="logo-gap">
                        <rect width="64" height="64" fill="white"/>
                        <rect x="37" y="-3" width="30" height="30" rx="11" fill="black"/>
                    </mask>
                    <g mask="url(#logo-gap)">
                        <rect class="logo-tile" y="8" width="56" height="56" rx="15"/>
                        <path class="logo-play" d="M21 26 40 36 21 46Z" stroke-width="6" stroke-linejoin="round"/>
                    </g>
                    <rect class="logo-badge" x="40" width="24" height="24" rx="8"/>
                    <path class="logo-check" d="M45.5 12 49.5 16 58 7" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>MyVideoGame<span class="brand-accent">List</span></span>
            </a>
        </div>
    </header>

    <main class="not-found">
        <div class="wrap">
            <p class="type-kicker kicker">Error 404</p>
            <h1 class="type-display">Page not found</h1>
            <p class="lead">
                There is nothing at this address. The home page says what MyVideoGameList is.
            </p>
            <p class="ways-in">
                <a class="btn btn-primary" href="/">Go to the home page</a>
            </p>
        </div>
    </main>

    <footer class="site-footer rule-heavy">
        <div class="wrap">
            <div class="foot-meta type-meta">
                <p>&copy; 2026 MyVideoGameList</p>
                <p class="foot-links">
                    <a href="https://discord.gg/pPnapgG3WU">Discord</a>
                    <a href="https://github.com/ChronosSF/myvideogamelist">Code on GitHub</a>
                </p>
            </div>
        </div>
    </footer>
</body>
</html>

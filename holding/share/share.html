<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!--
        The source of ../site/share.png, the holding page's share image: 1200 by 630, the size Open
        Graph and the large card are drawn at. render.mjs beside it draws this with Chromium.

        The page's own stylesheet supplies the tokens, the fonts, the logo's classes and the drawing of
        the lists, so the image is in the page's look by construction, and is set in the page's own
        type on any machine that renders it. Everything that matters stays inside the middle 1200 by
        600, because the large card crops the image to two to one.

        It shows the brand and a drawing of the lists, with made-up games and tinted covers: no game's
        art, so no credit is owed to anybody. No pixel matrix behind it, as the page has: Chromium
        fetches a mask image in CORS mode, which a page opened from disk cannot satisfy, and the glow then
        draws unmasked over the whole top.

        The flag between the "TEST RUN" comments is the test run's (ADR 0100). When the test ends it
        comes off, the image is drawn again, and the page's og:image:alt loses "Open for testing".
    -->
    <link rel="stylesheet" href="../site/style.css">
    <style>
        /* rem is a fifth larger than the page's, so the drawing of the lists reads at a card's size. */
        html {
            font-size: 20px;
        }

        html,
        body {
            width: 1200px;
            height: 630px;
            min-height: 0;
            overflow: hidden;
        }

        body {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 440px;
            align-items: center;
            gap: 64px;
            padding: 56px 72px;
        }

        .lockup {
            display: flex;
            align-items: center;
            gap: 18px;
            color: var(--color-fg-strong);
            font-size: 34px;
        }

        .lockup svg {
            width: 56px;
            height: 56px;
        }

        .headline {
            margin-top: 44px;
            color: var(--color-fg-strong);
            font-size: 64px;
            line-height: 0.98;
        }

        .flag {
            margin-top: 40px;
            gap: 14px;
            font-size: 20px;
        }

        .flag::before {
            width: 14px;
            height: 14px;
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--color-primary-500) 25%, transparent);
        }

        .domain {
            margin-top: 18px;
            color: var(--color-fg-muted);
            font-size: 22px;
            letter-spacing: 0.04em;
        }

        .demo {
            padding: 22px 26px 26px;
        }

        .demo-row:last-child {
            border-bottom: 0;
            padding-bottom: 0;
        }
    </style>
</head>
<body>
    <div>
        <div class="lockup type-display">
            <svg viewBox="0 0 64 64" aria-hidden="true">
                <mask id="logo-gap">
                    <rect width="64" height="64" fill="white"/>
                    <rect x="37" y="-3" width="30" height="30" rx="11" fill="black"/>
                </mask>
                <g mask="url(#logo-gap)">
                    <rect class="logo-tile" y="8" width="56" height="56" rx="15"/>
                    <path class="logo-play" d="M21 26 40 36 21 46Z" stroke-width="6" stroke-linejoin="round"/>
                </g>
                <rect class="logo-badge" x="40" width="24" height="24" rx="8"/>
                <path class="logo-check" d="M45.5 12 49.5 16 58 7" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>MyVideoGame<span class="brand-accent">List</span></span>
        </div>
        <p class="headline type-display">Every game you&rsquo;ve played, <span class="accent">in one list</span></p>
        <!-- TEST RUN (ADR 0100): from here... -->
        <p class="flag type-kicker trial-flag">Open for testing</p>
        <!-- ...to here. -->
        <p class="domain type-meta">myvideogamelist.net</p>
    </div>

    <div class="demo" aria-hidden="true">
        <div class="demo-tabs">
            <span class="demo-tab is-current">Playing <span class="type-meta">3</span></span>
            <span class="demo-tab">Backlog <span class="type-meta">41</span></span>
            <span class="demo-tab">Finished <span class="type-meta">128</span></span>
            <span class="demo-tab">On Hold <span class="type-meta">2</span></span>
        </div>

        <div class="demo-row">
            <span class="demo-cover is-a"></span>
            <span class="demo-name">
                <span class="type-title">Night Harbour</span>
                <span class="type-meta">PC &middot; 27 h played</span>
            </span>
            <svg class="demo-stars" viewBox="0 0 128 24" aria-hidden="true">
                <defs>
                    <path id="star" d="m12 1.5 3.1 6.4 7 1-5.05 4.95 1.2 7L12 17.55l-6.25 3.3 1.2-7L1.9 8.9l7-1Z"/>
                    <clipPath id="star-half"><rect width="12" height="24"/></clipPath>
                </defs>
                <use href="#star" class="star-on"/>
                <use href="#star" x="26" class="star-on"/>
                <use href="#star" x="52" class="star-on"/>
                <use href="#star" x="78" class="star-on"/>
                <use href="#star" x="104" class="star-off"/>
                <use href="#star" x="104" class="star-on" clip-path="url(#star-half)"/>
            </svg>
        </div>

        <div class="demo-row">
            <span class="demo-cover is-b"></span>
            <span class="demo-name">
                <span class="type-title">Copper Sky Rally</span>
                <span class="type-meta">Switch &middot; 12 h played</span>
            </span>
            <svg class="demo-stars" viewBox="0 0 128 24" aria-hidden="true">
                <use href="#star" class="star-on"/>
                <use href="#star" x="26" class="star-on"/>
                <use href="#star" x="52" class="star-on"/>
                <use href="#star" x="78" class="star-on"/>
                <use href="#star" x="104" class="star-off"/>
            </svg>
        </div>

        <div class="demo-row">
            <span class="demo-cover is-c"></span>
            <span class="demo-name">
                <span class="type-title">The Long Archive</span>
                <span class="type-meta">PS5 &middot; 2 h played</span>
            </span>
            <svg class="demo-stars" viewBox="0 0 128 24" aria-hidden="true">
                <use href="#star" class="star-off"/>
                <use href="#star" x="26" class="star-off"/>
                <use href="#star" x="52" class="star-off"/>
                <use href="#star" x="78" class="star-off"/>
                <use href="#star" x="104" class="star-off"/>
            </svg>
        </div>
    </div>
</body>
</html>

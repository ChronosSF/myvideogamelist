# Version updates, weekly, one PR per ecosystem and directory. Without this file Dependabot
# opens security updates only, so a pinned version - the CDK library in infra/, pinned on purpose
# so that synthesis cannot change under an unchanged source - would never move at all.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /MyVideoGameList.Server
      - /MyVideoGameList.Server.Tests
      - /MyVideoGameList.Server.IntegrationTests
      - /infra/src/Infra
    schedule:
      interval: weekly
    groups:
      # One PR for the framework's own packages, which move together on patch Tuesday.
      dotnet:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore.*"
          - "Microsoft.Extensions.*"
          # Pinned in both test projects, past the copy the SSM provider pulls in; it moves with
          # the framework.
          - "System.Security.Cryptography.Xml"
      # One PR for the test framework both test projects run on, so the two never differ.
      test:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
      # One PR for the CDK library and its constructs package, which move together.
      cdk:
        patterns:
          - "Amazon.CDK.*"
          - "Constructs"
  - package-ecosystem: npm
    directory: /myvideogamelist.client
    schedule:
      interval: weekly
    groups:
      react-router:
        patterns:
          - "react-router"
          - "@react-router/*"
      # One PR for React and its renderer, and for their types. react-dom refuses to load beside
      # any other version of react, and nothing moves react-dom when react moves, so a PR for react
      # alone fails every client test — which is how 19.3 arrived.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

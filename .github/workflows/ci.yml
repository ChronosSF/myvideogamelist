name: CI

# Every pull request, whatever branch it targets, so that one stacked on another's branch is checked
# like any other; and every push to master, which is what Deploy dev waits on. The job names are the
# required checks of the ruleset ADR 0061 asks the owner for, so renaming or adding a job is a change
# to that ruleset too.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to a pull request cancels the run it supersedes. A push to master is never grouped with
# another: GitHub cancels a run waiting in a group whenever a newer one joins it, and a master commit
# whose run never finishes gets no images and no deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest
    # A hang ends here rather than at the six-hour default; a run takes about a minute.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: myvideogamelist.client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: myvideogamelist.client/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Generates the React Router route types before type-checking, otherwise
      # the ./+types/* imports in route modules cannot resolve.
      - name: Type-check
        run: npm run typecheck

      # Before the build, so a failing behavioural test stops the job at the cheaper step.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MyVideoGameList.Server.Tests/MyVideoGameList.Server.Tests.csproj

      - name: Build
        run: dotnet build MyVideoGameList.Server.Tests/MyVideoGameList.Server.Tests.csproj --no-restore

      - name: Test
        run: dotnet test MyVideoGameList.Server.Tests/MyVideoGameList.Server.Tests.csproj --no-build --verbosity normal

      # The house style that .editorconfig states, over every project in the solution, after the tests
      # so that a formatting slip never hides a failing test. `dotnet format MyVideoGameList.slnx` makes
      # the changes this asks for. ADR 0061.
      - name: Format
        run: dotnet format MyVideoGameList.slnx --verify-no-changes

  # The API booted over a real PostgreSQL, for what EF InMemory cannot do: cascades, set-based
  # deletes, isolation, and the request pipeline end to end. Its own job, so the unit tests above
  # stay as quick and as Docker-free as they were. The runner has Docker; Testcontainers starts the
  # container and its reaper, which is left on, removes it however the run ends. Nothing reaches
  # IGDB, which has no credentials here. Deploy dev waits on this as on every job. See ADR 0057.
  integration:
    name: Server integration
    runs-on: ubuntu-latest
    # A hang, such as a pull that stalls or a test that deadlocks, ends the job here rather than at
    # a far longer default. A container that never becomes ready fails sooner, in the suite itself.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MyVideoGameList.Server.IntegrationTests/MyVideoGameList.Server.IntegrationTests.csproj

      - name: Build
        run: dotnet build MyVideoGameList.Server.IntegrationTests/MyVideoGameList.Server.IntegrationTests.csproj --no-restore

      # A test still running after five minutes is a hang: the run stops and names it.
      - name: Test
        run: dotnet test MyVideoGameList.Server.IntegrationTests/MyVideoGameList.Server.IntegrationTests.csproj --no-build --verbosity normal --blame-hang-timeout 5m --blame-hang-dump-type none

  # One browser test over the two-process shape that is deployed: sign up, add a game to a list,
  # reload, and it is still there. The front end's production build and the API run as two processes
  # behind a stand-in for what routes between them deployed, which sends /api/* to one and everything
  # else to the other, as the balancer does. So the application's half of the failure ADR 0003
  # describes - pages that render while every request the browser makes to the API fails - fails here,
  # before a merge. Whether the deployed edge itself routes is scripts/dev-check.mjs's to check. IGDB
  # is a stand-in too, and no credential is needed. Deploy dev waits on this as on every job. See
  # ADR 0060.
  e2e:
    name: Browser smoke test
    runs-on: ubuntu-latest
    # A hang ends here rather than at a far longer default.
    timeout-minutes: 15
    services:
      # compose.yaml's image and credentials, so the test's default connection string is the same here
      # as on a developer's machine; the image is in PostgresServer.cs and the Lighthouse job too,
      # so change the four together. The database exists from the start, and the API only migrates it. Checked over TCP,
      # because the image's first-run setup answers on its socket before the real server listens; and
      # pulled before any step runs, so a Docker Hub login would need `credentials:` here.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mvgl_e2e
          POSTGRES_USER: mvgl
          POSTGRES_PASSWORD: localdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U mvgl -d mvgl_e2e"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: myvideogamelist.client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: myvideogamelist.client/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: npm ci

      # The headless shell alone, which is what a headless run launches, and the libraries it needs.
      - name: Install the browser
        run: npx playwright install --with-deps --only-shell chromium

      # Its own step, so a compile error fails here rather than as an API that never started. Under CI
      # the test runs this build as it is, without building again.
      - name: Build the API
        run: dotnet build ../MyVideoGameList.Server/MyVideoGameList.Server.csproj

      # Builds the front end, starts both servers and the two stand-ins, and runs the test.
      - name: Run the test
        run: npm run e2e

      # Every request, response and DOM snapshot of a failed run: `npx playwright show-trace` on the zip.
      # Named for the attempt, so a re-run of a failure uploads a trace of its own.
      - name: Upload the trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-trace-${{ github.run_attempt }}
          path: myvideogamelist.client/e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Lighthouse on the same production shape, page by page, on a phone and on a desktop: three runs
  # each, judged on the median. What moves only when a page does fails the job when it moves:
  # accessibility, best practices, SEO and the console's errors against the baseline, layout shift and
  # the weight of script and of everything against a limit. Performance warns, and fails only under a
  # floor, because a lab score on a shared runner moves with the runner. Then axe-core in full on the
  # same pages, which fails on a rule or a contrast pair a page did not already break. The IGDB
  # stand-in answers with real games, so the covers come from IGDB's image host, the one site the
  # audit's browser reaches outside the runner; an outage there fails the job, so re-run it once the
  # host is back, on master only for its newest commit, since Deploy dev deploys whichever commit a
  # successful run was for (#339). The reports are an artifact and the figures a table in the job
  # summary; nothing goes to LHCI's public storage. Deploy dev waits on this as on every job. See ADR
  # 0068.
  lighthouse:
    name: Lighthouse
    # Pinned, unlike the other jobs: the baseline was measured on this image, and a new one brings new
    # fonts and libraries under the browser. Moving it is a pull request that re-takes the baseline.
    runs-on: ubuntu-24.04
    # A hang ends here rather than at a far longer default. Thirty audits take most of a run.
    timeout-minutes: 30
    services:
      # As the smoke test's, with a database of the audit's own name, and checked over TCP for the same
      # reason. The image is in three other places, so change the four together.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mvgl_lighthouse
          POSTGRES_USER: mvgl
          POSTGRES_PASSWORD: localdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U mvgl -d mvgl_lighthouse"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: myvideogamelist.client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: |
            myvideogamelist.client/package-lock.json
            myvideogamelist.client/lighthouse/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: npm ci

      # Lighthouse CI has a lockfile of its own, so that its dependencies stay out of the client's.
      - run: npm ci --prefix lighthouse

      # Chromium itself rather than the headless shell the smoke test uses: Lighthouse audits in the
      # browser's own headless mode, and the axe test asks for it by channel. Pinned with Playwright, so a
      # score moves only when Playwright is bumped.
      - name: Install the browser
        run: npx playwright install --with-deps --no-shell chromium

      # Its own step, so a compile error fails here rather than as an API that never started. Under CI
      # the audit runs this build as it is, without building again.
      - name: Build the API
        run: dotnet build ../MyVideoGameList.Server/MyVideoGameList.Server.csproj

      # Builds the front end, starts both servers and the two stand-ins, seeds an account, runs
      # Lighthouse CI on mobile and then on desktop, and then axe. Both tables go to the job summary.
      - name: Audit
        run: npm run lighthouse

      # Each page's median report, as HTML to open and as JSON, with the summary and the thresholds.
      # Named for the attempt, so a re-run uploads reports of its own.
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports-${{ github.run_attempt }}
          path: myvideogamelist.client/lighthouse/reports/
          retention-days: 14
          if-no-files-found: ignore

      # Every run of a failed audit, which never reached the reports when Lighthouse CI stopped early: some
      # forty megabytes, so only then. The browser's profiles stay behind.
      - name: Upload every run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-runs-${{ github.run_attempt }}
          path: |
            myvideogamelist.client/lighthouse/.lighthouseci/
            !myvideogamelist.client/lighthouse/.lighthouseci/chrome-profile-*/
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true

  # Known vulnerabilities in every package either side resolves, and in Lighthouse CI's, direct or
  # transitive, as NuGet's and npm's advisory data describe them on the day of the run. A job of its
  # own, so that an advisory published overnight turns this check red and leaves the build and test
  # jobs saying what they say. Each later step runs even when an earlier one fails, so one run reports
  # every finding. A finding with no fixed version has a way through on each side, and a new lock file
  # needs a step of its own, as Lighthouse CI's has. Deploy dev waits on this as on every job. See ADR
  # 0061.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      # NuGet's own audit, at restore, of every package at every severity (Directory.Build.props). The
      # codes made errors are its findings, NU1901 to NU1904 from low to critical, and NU1900, an audit
      # that could not read the advisory data and would otherwise pass as clean. `dotnet list package
      # --vulnerable` is not used: it exits 0 whatever it finds.
      - name: NuGet, the application
        run: dotnet restore MyVideoGameList.slnx -warnaserror:NU1900,NU1901,NU1902,NU1903,NU1904

      - name: NuGet, the CDK app
        if: ${{ !cancelled() }}
        run: dotnet restore infra/src/Infra/Infra.csproj -warnaserror:NU1900,NU1901,NU1902,NU1903,NU1904

      # npm audit, devDependencies included, failing at high and critical. It reads package-lock.json
      # alone, so nothing is installed.
      - name: npm
        if: ${{ !cancelled() }}
        working-directory: myvideogamelist.client
        run: npm run audit

      # Lighthouse CI's lock file, against a list of its own in the same script: a tool whose
      # dependencies are not overridden (ADR 0068 §9), so an advisory with no fix in range is judged and
      # listed there rather than patched under it, and a new one fails until it is.
      - name: npm, Lighthouse CI
        if: ${{ !cancelled() }}
        working-directory: myvideogamelist.client
        run: npm run audit:lighthouse

  # Every commit reachable from what is being tested, searched for secrets by gitleaks with
  # .gitleaks.toml. For a pull request that is the history of its merge with the base: the commits it
  # adds, every one before them, and what each merge itself changed. The scanner is gitleaks' own
  # release image, pinned by digest, run with no network and the checkout mounted read-only, and the
  # checkout keeps no token for it to find. It prints where a finding is and nothing of the line it is
  # on (.github/gitleaks-report.tmpl), because the log is public. CLAUDE.md's command names the same
  # tag, so change the two together. Deploy dev waits on this as on every job. See ADR 0061.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # .gitleaks.toml is the one place a finding is allowed, so an inline gitleaks:allow comment is
      # ignored and a .gitleaksignore is refused. gitleaks reports a history it could not read as
      # "0 commits scanned" and no leaks, and exits 0, so the step reads its log for that as well.
      - name: Scan every commit
        run: |
          set -o pipefail
          if [ -e .gitleaksignore ]; then
            echo "::error::.gitleaksignore is not read here: allow a finding in .gitleaks.toml, by what it is."
            exit 1
          fi
          docker run --rm --network none --volume "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --log-opts="HEAD --diff-merges=first-parent" \
            --ignore-gitleaks-allow --redact --no-banner --no-color \
            --report-format template --report-template /repo/.github/gitleaks-report.tmpl --report-path - \
            2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          if grep -q ' ERR ' "$RUNNER_TEMP/gitleaks.log" || ! grep -Eq ' [1-9][0-9]* commits scanned' "$RUNNER_TEMP/gitleaks.log"; then
            echo "::error::gitleaks did not read the history, so nothing was checked."
            exit 1
          fi

  # Both images, built as Deploy dev builds them, less the two build arguments that name the commit
  # (ADR 0059), and pushed nowhere, so that what breaks only an image fails before a merge rather than
  # at the next deploy. vite.config.ts once needed the .NET SDK to build, which GitHub's runners have
  # and node:24 does not (ADR 0044). And the SSR image installs its production dependencies alone, so a
  # server that imports a devDependency builds and then fails to start (ADR 0060): which is why that
  # image is then started and asked for /robots.txt, the path the balancer's health check asks for.
  # Layers come from the Actions cache that Deploy dev writes on master, while they still match: a base
  # image that has moved since makes every layer above it rebuild. CI only reads that cache, so a pull
  # request adds no image layers to it. The builds pull from Docker Hub, MCR, nuget.org and npm, none of
  # it retried, so re-run a failure once before looking into it, on master only for its newest commit
  # (#339). Deploy dev waits on this as on every job. See ADR 0061.
  images:
    name: Images
    runs-on: ubuntu-latest
    # A cold build of both took under three minutes.
    timeout-minutes: 15
    # No build record uploaded as an artifact: nobody reads it, anyone signed in can download one from a
    # public repository, and on a push to master the build holds a token that can write the cache.
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: MyVideoGameList.Server/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha,scope=api

      - name: Build the SSR image
        uses: docker/build-push-action@v7
        with:
          context: myvideogamelist.client
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: mvgl-ssr:ci
          cache-from: type=gha,scope=ssr

      # With the image's own command and user, and none of the configuration a task definition adds:
      # a robots.txt asks nothing of the API.
      - name: Start the SSR image
        run: |
          docker run --detach --name ssr --publish 127.0.0.1:3000:3000 mvgl-ssr:ci
          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 2 --output /dev/null http://127.0.0.1:3000/robots.txt; then
              echo "The SSR server answered /robots.txt within ${attempt} s."
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' ssr)" != "true" ]; then
              echo "::error::The SSR server stopped before it answered."
              break
            fi
            sleep 1
          done
          docker logs ssr
          exit 1

  # The CDK app compiles, so a construct renamed by a library bump or a stack edited without
  # building is caught here rather than on the next deploy. Synthesis is not run: it needs
  # credentials for the context lookups, and the long-lived stacks are deployed from a developer
  # machine on purpose (ADR 0044).
  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build infra/src/Infra/Infra.csproj

      # The house style the Server job checks, over the CDK app, which is not in the solution.
      - name: Format
        run: dotnet format infra/src/Infra/Infra.csproj --verify-no-changes --no-restore

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    # A hang ends here rather than at the six-hour default, which would hold a master commit's deploy as
    # long; the slowest leg, C#, takes about three minutes.
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # "actions" scans the workflow files themselves. Autodetect was picking it
        # up before; keep it now that languages are explicit.
        language: [csharp, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          # NOTE: "languages", plural. An unknown input is silently ignored, and
          # init then autodetects every language in the repo — which made both
          # matrix legs build a C# database, and the JS leg fail finalizing one
          # it never compiled.
          languages: ${{ matrix.language }}

          # Buildless analysis. Nothing is compiled here, so CodeQL cannot fail on
          # build tracing, and the C# is already compiled and tested by the Server
          # job above.
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

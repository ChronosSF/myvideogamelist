name: Deploy dev

# Every green CI run on master builds both images and pushes them to ECR tagged with the commit,
# at a cost of cents, so ECR holds an image for every commit that reached master. Only an awake
# environment is deployed: the DEV_DEPLOY_ENABLED variable on the `dev` GitHub environment is the
# gate, because deploying the application stack *recreates* it if it was destroyed, and an
# unconditional deploy-on-merge would silently un-park the environment and start the balancer
# billing again (ADR 0044, D-6). `node scripts/dev-env.mjs park|resume` sets the gate.
#
# No AWS key is stored in GitHub. The job proves who it is with a token GitHub signs, and AWS
# exchanges it for an hour of credentials on a role whose trust policy admits exactly one subject:
# a job in this repository that declares the `dev` environment, whose deployments are restricted to
# master. Everything the job deploys, it deploys as the CDK bootstrap roles; the long-lived stacks
# are never deployed here, and both deploys are `--exclusively` so the Data stack - which,
# synthesised without `allowedCidr`, admits CloudFront only - is never touched as a dependency.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Two deploys never interleave; a second merge waits for the first.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push, and deploy when awake
    # workflow_run fires on a failed CI too. Only a green one deploys; a manual run always may.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
      AWAKE: ${{ vars.DEV_DEPLOY_ENABLED }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI tested, not whatever master is by the time this runs.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Name the release
        id: release
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # The repositories are immutable: a tag is pushed once. A re-run for the same commit - to
      # deploy after the environment was resumed, say - finds its images already there and skips
      # the build rather than being refused by the push. Tracked per repository, so a run that
      # died between the two pushes is finished by the next one rather than blocked by it.
      - name: Already pushed?
        id: pushed
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          have() { aws ecr describe-images --repository-name "$1" --image-ids "imageTag=$TAG" >/dev/null 2>&1; }
          for repo in api ssr; do
            if have "mvgl/$repo"; then
              echo "mvgl/$repo:$TAG is already pushed."
              echo "$repo=true" >> "$GITHUB_OUTPUT"
            else
              echo "$repo=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - uses: docker/setup-buildx-action@v4
        if: steps.pushed.outputs.api != 'true' || steps.pushed.outputs.ssr != 'true'

      # provenance: false, because the attestation manifest BuildKit otherwise pushes alongside
      # shows in ECR as an untagged image and counts against the lifecycle rule's twenty.
      - name: Build and push the API image
        if: steps.pushed.outputs.api != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: MyVideoGameList.Server/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/mvgl/api:${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push the SSR image
        if: steps.pushed.outputs.ssr != 'true'
        uses: docker/build-push-action@v7
        with:
          context: myvideogamelist.client
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/mvgl/ssr:${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=ssr
          cache-to: type=gha,scope=ssr,mode=max

      - name: Parked?
        if: env.AWAKE != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: echo "DEV_DEPLOY_ENABLED is not true, so the environment is parked. Images $TAG are pushed; nothing is deployed."

      # ---- Everything below runs only when the environment is awake. ----

      - uses: actions/setup-dotnet@v6
        if: env.AWAKE == 'true'
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        if: env.AWAKE == 'true'
        with:
          node-version: '24.x'

      - name: Install the CDK CLI
        if: env.AWAKE == 'true'
        run: npm install -g aws-cdk

      - name: Deploy the migration task definition
        if: env.AWAKE == 'true'
        working-directory: infra
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: cdk deploy Mvgl-dev-Migrate --exclusively -c env=dev -c "imageTag=$TAG" --require-approval never

      # Before anything serves traffic: outside Development the application never migrates by
      # itself, and a deployed API against an un-migrated database passes /healthz and fails on
      # its first query. A non-zero exit stops the release here.
      - name: Run the migrations
        if: env.AWAKE == 'true'
        run: |
          set -euo pipefail
          output() { aws cloudformation describe-stacks --stack-name Mvgl-dev-Data --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          SUBNETS=$(output TaskSubnetIds)
          SG=$(output ApiSecurityGroupId)
          TASK=$(aws ecs run-task --cluster mvgl-dev --task-definition mvgl-dev-migrate --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --query "tasks[0].taskArn" --output text)
          echo "Migration task: $TASK"
          aws ecs wait tasks-stopped --cluster mvgl-dev --tasks "$TASK"
          EXIT=$(aws ecs describe-tasks --cluster mvgl-dev --tasks "$TASK" --query "tasks[0].containers[0].exitCode" --output text)
          echo "::group::Migration log"
          aws logs tail /mvgl/dev/migrate --since 30m --format short || true
          echo "::endgroup::"
          if [ "$EXIT" != "0" ]; then
            echo "::error::The migration task exited with $EXIT. Nothing was deployed."
            exit 1
          fi

      - name: Deploy the application stack
        if: env.AWAKE == 'true'
        working-directory: infra
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: cdk deploy Mvgl-dev-App --exclusively -c env=dev -c "imageTag=$TAG" --require-approval never

      - name: Wait for both services
        if: env.AWAKE == 'true'
        run: aws ecs wait services-stable --cluster mvgl-dev --services api ssr

      # Until CloudFront exists the balancer admits one address, and it is not this runner's, so
      # the proof is target health. From the CloudFront phase this becomes /readyz and / through
      # the distribution, with the basic-auth pair as the one secret the workflow holds.
      - name: Smoke test
        if: env.AWAKE == 'true'
        run: |
          set -euo pipefail
          # A group can hold more than one target for a while - the old task draining beside the
          # new one - so the test is "at least one healthy and nothing unhealthy", not one word.
          for key in ApiTargetGroupArn SsrTargetGroupArn; do
            ARN=$(aws cloudformation describe-stacks --stack-name Mvgl-dev-App --query "Stacks[0].Outputs[?OutputKey=='$key'].OutputValue" --output text)
            STATES=$(aws elbv2 describe-target-health --target-group-arn "$ARN" --query "TargetHealthDescriptions[].TargetHealth.State" --output text | tr '\t' ' ')
            echo "$key: $STATES"
            case " $STATES " in
              *" unhealthy "*) echo "::error::$key has an unhealthy target"; exit 1 ;;
              *" healthy "*) ;;
              *) echo "::error::$key has no healthy target"; exit 1 ;;
            esac
          done

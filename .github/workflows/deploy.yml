name: Deploy

# The one deploy, which `Deploy dev` and `Deploy prod` each call for their own environment, so that
# production is released by the steps dev has been released by, and by no others (ADR 0103). It is
# never run by itself: each caller is dispatched by hand, from the Actions tab or with
# `gh workflow run deploy-dev.yml`, and nothing deploys an environment on its own (ADR 0099).
#
# A run builds master as it is when the job starts, pushes both images to the environment's ECR
# tagged with that commit, and deploys it if the environment is awake. So a merge reaches an
# environment when the owner chooses, and a run that waited behind another, or a re-run of an old
# one, deploys master's newest rather than the commit it was dispatched at, or stops if these files
# have changed since. Nothing here checks CI: a commit reaches master through a pull request whose
# required checks passed, strict, unless an admin bypassed the ruleset, which it allows.
#
# Only an awake environment is deployed: the variable the caller names, on the GitHub environment,
# is the gate, because deploying the application stack *recreates* it if it was destroyed, and a
# run dispatched while it is parked would silently un-park it and start the balancer billing again
# (ADR 0044, D-6). `node scripts/dev-env.mjs park|resume` sets the gate. With the gate off, a run
# builds and pushes and stops, which is how `resume`, deploying the newest tag in ECR, gets
# master's: run this first. The gate is read once, when the job starts, so the job also refuses to
# create a stack it finds gone: it only ever updates the application stack, and creating it is
# `resume`'s job alone. That is also what keeps production's first deploy, which takes the domain
# from the holding page, a thing done by hand.
#
# No AWS key is stored in GitHub. The job proves who it is with a token GitHub signs, and AWS
# exchanges it for an hour of credentials on a role whose trust policy admits exactly one subject:
# a job in this repository that declares the environment, whose deployments are restricted to
# master. The GitHub environment `prod` also asks its reviewers before the job starts. Everything
# the job deploys, it deploys as the CDK bootstrap roles; the long-lived stacks are never deployed
# here, and both deploys are `--exclusively` so that the Data stack is never redeployed as a
# dependency by a job that was only ever meant to deploy these two.

on:
  workflow_call:
    inputs:
      environment:
        description: The environment, as the CDK app's `env` and the GitHub environment are both named.
        required: true
        type: string
      gate:
        description: The variable on that GitHub environment that says it is awake.
        required: true
        type: string

# The caller grants these two, and a called workflow can ask for no more than it was granted.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build, push, and deploy when awake
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENV_NAME: ${{ inputs.environment }}
      GATE: ${{ inputs.gate }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
      AWAKE: ${{ vars[inputs.gate] }}
      # No build record uploaded as an artifact, as in CI's Images job: nobody reads it, anyone signed in
      # can download one from a public repository, and the build holds a token that can write the cache.
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v7
        with:
          # Master's head as the job starts, not the commit the run was dispatched at, which a run that
          # waited, or a re-run, would otherwise deploy over anything newer. A branch's full name, not
          # `master`, which fetches every branch whose name begins with it.
          ref: refs/heads/master

      # The steps a run executes are this file and its caller as they were at github.workflow_sha, the
      # commit the run was dispatched at, whatever the checkout above holds. A re-run, or a run that
      # waited while a merge changed either, would run old steps against master's newer code, so a run
      # whose files are not master's stops here, before it builds anything. A run of the current files
      # passes.
      - name: Is this master's workflow?
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          if [ "$WORKFLOW_SHA" != "$(git rev-parse HEAD)" ]; then
            git fetch --quiet --depth 1 origin "$WORKFLOW_SHA"
            if ! git diff --quiet "$WORKFLOW_SHA" HEAD -- .github/workflows/deploy.yml ".github/workflows/deploy-$ENV_NAME.yml"; then
              echo "::error::This run's workflow is master's as of ${WORKFLOW_SHA:0:12}, and master's has changed since. Dispatch a new run."
              exit 1
            fi
          fi

      # The tag, and what both images answer at /version and /api/version: the full commit and one
      # build time for the release. Compare the two answers by sha: a re-run that finishes a
      # half-pushed release builds the second image later, with a time of its own.
      - name: Name the release
        id: release
        run: |
          echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # The repositories are immutable: a tag is pushed once. A re-run for the same commit - to
      # deploy after the environment was resumed, say - finds its images already there and skips
      # the build rather than being refused by the push. Tracked per repository, so a run that
      # died between the two pushes is finished by the next one rather than blocked by it.
      - name: Already pushed?
        id: pushed
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          for repo in api ssr; do
            # Only "no such image" means not pushed. Anything else - a denied DescribeImages, which
            # is how the first run went - would otherwise read as "not pushed" and send a rebuild
            # into an immutable repository, where the push succeeds only while the digest is the same.
            if OUT=$(aws ecr describe-images --repository-name "mvgl/$repo" --image-ids "imageTag=$TAG" 2>&1 >/dev/null); then
              echo "mvgl/$repo:$TAG is already pushed."
              echo "$repo=true" >> "$GITHUB_OUTPUT"
            elif [[ "$OUT" == *ImageNotFoundException* ]]; then
              echo "$repo=false" >> "$GITHUB_OUTPUT"
            else
              echo "$OUT"; exit 1
            fi
          done

      - uses: docker/setup-buildx-action@v4
        if: steps.pushed.outputs.api != 'true' || steps.pushed.outputs.ssr != 'true'

      # provenance: false, because the attestation manifest BuildKit otherwise pushes alongside
      # shows in ECR as an untagged image and counts against the lifecycle rule's twenty. CI's Images
      # job reads the two cache scopes written here, so rename them in both files (ADR 0061). Each
      # environment's run builds its own image from the same commit, into its own account's
      # repository; the cache is what makes the second one quick.
      - name: Build and push the API image
        if: steps.pushed.outputs.api != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: MyVideoGameList.Server/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            GIT_SHA=${{ steps.release.outputs.sha }}
            BUILD_TIME=${{ steps.release.outputs.built }}
          tags: ${{ env.REGISTRY }}/mvgl/api:${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push the SSR image
        if: steps.pushed.outputs.ssr != 'true'
        uses: docker/build-push-action@v7
        with:
          context: myvideogamelist.client
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            GIT_SHA=${{ steps.release.outputs.sha }}
            BUILD_TIME=${{ steps.release.outputs.built }}
          tags: ${{ env.REGISTRY }}/mvgl/ssr:${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=ssr
          cache-to: type=gha,scope=ssr,mode=max

      - name: Parked?
        if: env.AWAKE != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: echo "$GATE is not true on the $ENV_NAME environment, so it is parked, or not made yet. Images $TAG are pushed; nothing is deployed."

      # ---- Everything below runs only when the environment is awake. ----

      - uses: actions/setup-dotnet@v6
        if: env.AWAKE == 'true'
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        if: env.AWAKE == 'true'
        with:
          node-version: '24.x'

      # The version infra/package-lock.json pins, which the Dependency audit reads and the Infrastructure
      # job synthesises with, rather than whatever is newest on the day (#339). No install script runs, so
      # a later version that adds one cannot run it in the job that holds the deploy role.
      - name: Install the CDK CLI
        if: env.AWAKE == 'true'
        run: npm ci --prefix infra --ignore-scripts

      - name: Deploy the migration task definition
        if: env.AWAKE == 'true'
        working-directory: infra
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: node_modules/.bin/cdk deploy "Mvgl-$ENV_NAME-Migrate" --exclusively -c "env=$ENV_NAME" -c "imageTag=$TAG" --require-approval never

      # Before anything serves traffic: outside Development the application never migrates by
      # itself, and a deployed API against an un-migrated database passes /healthz and fails on
      # its first query. A non-zero exit stops the release here.
      - name: Run the migrations
        if: env.AWAKE == 'true'
        run: |
          set -euo pipefail
          output() { aws cloudformation describe-stacks --stack-name "Mvgl-$ENV_NAME-Data" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          SUBNETS=$(output TaskSubnetIds)
          SG=$(output ApiSecurityGroupId)
          # Whether the task takes a public address is the Data stack's to say, beside its subnets:
          # DISABLED where they are private behind a NAT gateway, as production's are. A Data stack
          # that says nothing has public subnets with no NAT gateway, dev's among them, and there a
          # task without an address cannot even pull its image (ADR 0105).
          PUBLIC_IP=$(output TaskAssignPublicIp)
          case "$PUBLIC_IP" in
            ""|None) PUBLIC_IP=ENABLED ;;
            ENABLED|DISABLED) ;;
            *) echo "::error::Mvgl-$ENV_NAME-Data's TaskAssignPublicIp is '$PUBLIC_IP', which is neither ENABLED nor DISABLED."; exit 1 ;;
          esac
          echo "Migration task network: subnets $SUBNETS, public address $PUBLIC_IP"
          TASK=$(aws ecs run-task --cluster "mvgl-$ENV_NAME" --task-definition "mvgl-$ENV_NAME-migrate" --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=$PUBLIC_IP}" \
            --query "tasks[0].taskArn" --output text)
          echo "Migration task: $TASK"
          aws ecs wait tasks-stopped --cluster "mvgl-$ENV_NAME" --tasks "$TASK"
          EXIT=$(aws ecs describe-tasks --cluster "mvgl-$ENV_NAME" --tasks "$TASK" --query "tasks[0].containers[0].exitCode" --output text)
          echo "::group::Migration log"
          aws logs tail "/mvgl/$ENV_NAME/migrate" --since 30m --format short || true
          echo "::endgroup::"
          if [ "$EXIT" != "0" ]; then
            echo "::error::The migration task exited with $EXIT. Nothing was deployed."
            exit 1
          fi

      # The gate was read once, when this job started. A park that began since then has destroyed
      # the application stack or is destroying it, and deploying now would recreate it over a
      # database the park is about to stop - the silent un-park D-6 exists to prevent, and one the
      # smoke test cannot see, since /healthz asks nothing of the database. So this workflow only
      # ever *updates* the stack; creating it is `dev-env.mjs resume`'s job alone. A park that
      # starts a moment after this check fails one side or the other loudly: CloudFormation refuses
      # to update a stack being deleted, and to delete one being updated.
      - name: Is the application stack still there?
        id: app
        if: env.AWAKE == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          STACK="Mvgl-$ENV_NAME-App"
          if STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].StackStatus" --output text 2>&1); then :
          elif [[ "$STATUS" == *"does not exist"* ]]; then STATUS=ABSENT
          else echo "$STATUS"; exit 1
          fi
          echo "$STACK: $STATUS"
          case "$STATUS" in
            ABSENT|DELETE_*)
              echo "::warning::$STACK is not there: the environment was parked while this run was in flight, or was never made. Images $TAG are pushed; nothing is deployed."
              echo "present=false" >> "$GITHUB_OUTPUT" ;;
            # The settled states of a stack that exists, and the only ones a deploy updates.
            CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE|IMPORT_ROLLBACK_COMPLETE)
              echo "present=true" >> "$GITHUB_OUTPUT" ;;
            # Everything else stops the run. A creation that never finished, the CLI answers by creating
            # the stack, which is resume's alone: it deletes one in ROLLBACK_COMPLETE or ROLLBACK_FAILED
            # and creates it again, and counts REVIEW_IN_PROGRESS as absent (aws-cdk 2.1148.0's
            # lib/index.js). And a change under way, or stuck, is somebody's to look at.
            *)
              echo "::error::$STACK is $STATUS, which a deploy would create anew or cannot update. Images $TAG are pushed; nothing is deployed."
              exit 1 ;;
          esac

      - name: Deploy the application stack
        if: env.AWAKE == 'true' && steps.app.outputs.present == 'true'
        working-directory: infra
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: node_modules/.bin/cdk deploy "Mvgl-$ENV_NAME-App" --exclusively -c "env=$ENV_NAME" -c "imageTag=$TAG" --require-approval never

      - name: Wait for both services
        if: env.AWAKE == 'true' && steps.app.outputs.present == 'true'
        run: aws ecs wait services-stable --cluster "mvgl-$ENV_NAME" --services api ssr

      # A cached page names hashed bundles the new container no longer has, because the bundles are
      # served by the SSR container and not from S3: without this, a deploy leaves cached pages
      # pointing at scripts that 404 (ADR 0044). A wildcard counts as one path, and the first
      # thousand a month are free. The id is read from the stack, since it changes on every resume.
      - name: Invalidate the distribution
        if: env.AWAKE == 'true' && steps.app.outputs.present == 'true'
        run: |
          set -euo pipefail
          ID=$(aws cloudformation describe-stacks --stack-name "Mvgl-$ENV_NAME-App" --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          INVALIDATION=$(aws cloudfront create-invalidation --distribution-id "$ID" --paths "/*" --query "Invalidation.Id" --output text)
          echo "Invalidation $INVALIDATION of distribution $ID"
          aws cloudfront wait invalidation-completed --distribution-id "$ID" --id "$INVALIDATION"

      # Target health first: a group can hold more than one target for a while - the old task
      # draining beside the new one - so that test is "at least one healthy and nothing unhealthy".
      # Then the whole chain, through the distribution. Behind basic auth, every path without the pair
      # is a 401, which proves the function is on the door; with it, /readyz is the API answering
      # through CloudFront, the balancer and its origin-verify rule, and / is the SSR server doing
      # the same. The pair is the one secret the workflow holds (ADR 0046), and the checks that need
      # it are skipped with a warning until it is set on the environment. Deployed open (ADR 0101),
      # the same three paths answer 200 to nobody in particular, and the pair is not sent.
      - name: Smoke test
        if: env.AWAKE == 'true' && steps.app.outputs.present == 'true'
        env:
          # The pair is the environment's own secret, <ENV>_BASIC_AUTH, and each is written out here.
          # A name worked out from an input, `secrets[...]`, cannot be known before the job runs, so
          # the runner would be handed every secret the job can read to pick one from. The caller
          # passes it with `secrets: inherit`: one it does not pass is empty here. Each is read only
          # in its own environment's run, and neither as the other's fallback: `a && b || c` is c
          # whenever b is empty, which would hand production dev's pair if a secret of that name were
          # ever the repository's. An environment not named here has no pair.
          BASIC_AUTH: ${{ inputs.environment == 'prod' && secrets.PROD_BASIC_AUTH || inputs.environment == 'dev' && secrets.DEV_BASIC_AUTH || '' }}
        run: |
          set -euo pipefail
          STACK="Mvgl-$ENV_NAME-App"
          output() { aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          for key in ApiTargetGroupArn SsrTargetGroupArn; do
            ARN=$(output "$key")
            STATES=$(aws elbv2 describe-target-health --target-group-arn "$ARN" --query "TargetHealthDescriptions[].TargetHealth.State" --output text | tr '\t' ' ')
            echo "$key: $STATES"
            case " $STATES " in
              *" unhealthy "*) echo "::error::$key has an unhealthy target"; exit 1 ;;
              *" healthy "*) ;;
              *) echo "::error::$key has no healthy target"; exit 1 ;;
            esac
          done
          # Where the site answers is the stack's to say, as whether it asks for the pair is: both were
          # deployed a moment ago (ADR 0101, 0103). The check is that the site agrees with them.
          SITE=$(output SiteUrl)
          case "$SITE" in
            https://*) ;;
            *) echo "::error::$STACK does not say where the site answers: its SiteUrl output is '$SITE'."; exit 1 ;;
          esac
          DOOR=$(output BasicAuth)
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "$SITE/healthz")
          echo "Basic auth is $DOOR by the stack; $SITE/healthz without credentials: $STATUS"
          CREDENTIALS=()
          case "$DOOR" in
            on)
              if [ "$STATUS" != "401" ]; then
                echo "::error::Expected a 401 without credentials and got $STATUS: the door is not on."
                exit 1
              fi
              if [ -z "$BASIC_AUTH" ]; then
                echo "::warning::${ENV_NAME^^}_BASIC_AUTH is not set on the $ENV_NAME environment, so the authenticated checks were skipped."
                exit 0
              fi
              CREDENTIALS=(-u "$BASIC_AUTH") ;;
            off)
              if [ "$STATUS" != "200" ]; then
                echo "::error::The site is deployed open and /healthz without credentials answered $STATUS."
                exit 1
              fi ;;
            *)
              echo "::error::$STACK does not say whether basic auth is on: its BasicAuth output is '$DOOR'."
              exit 1 ;;
          esac
          for path in /readyz /; do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" ${CREDENTIALS[@]+"${CREDENTIALS[@]}"} "$SITE$path")
            echo "$SITE$path: $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "::error::$path answered $STATUS through the distribution."
              exit 1
            fi
          done

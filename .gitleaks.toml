# What CI's secret scan looks for (ADR 0061): gitleaks' own rules, three rules more for the shapes
# this repository's secrets take and the default rules miss, and three findings allowed, each by
# exactly what it is rather than by a file or a rule turned off.
title = "MyVideoGameList"

[extend]
useDefault = true

# A password in a URL's user information, as a database URL carries it. The default rules have no
# rule for it. Placeholders and variables are not passwords: <password>, ${PGPASSWORD}, %s.
[[rules]]
id = "url-password"
description = "A password in the user information of a URL"
regex = '''(?i)\b[a-z][a-z0-9+.-]*://[^\s:/@'"`<>]+:([^\s/@'"`<>$%{}]+)@[^\s/@'"`<>]+'''
secretGroup = 1
keywords = ["://"]

# The dev site's basic-auth pair, user:password, assigned to a setting with "basic auth" in its
# name, as MVGL_DEV_BASIC_AUTH and the DEV_BASIC_AUTH secret are. The generic rule stops at the colon.
[[rules]]
id = "basic-auth-pair"
description = "A user:password pair assigned to a basic-auth setting"
regex = '''(?i)\b\w*basic_?auth\w*\s*[:=]\s*['"]?([^\s'"`:$]+:[^\s'"`]+)'''
secretGroup = 1
keywords = ["basic_auth", "basicauth"]

# The default generic rule wants a value of ten characters or more that looks random, so a real
# connection string with a short or guessable password passes it. This catches the password in any
# connection string or database container's environment, whatever it looks like.
[[rules]]
id = "connection-password"
description = "A password in a connection string or a database container's environment"
regex = '''(?i)(?:\b(?:password|pwd)=|\b(?:postgres_password|pgpassword)\s*[:=]\s*['"]?)([^\s;'"`]+)'''
secretGroup = 1
keywords = ["password=", "pwd=", "postgres_password", "pgpassword"]

    # The local container's credentials, mvgl/localdev, committed on purpose so that a fresh checkout
    # runs with no setup (ADR 0005, 0060). They reach nothing beyond a developer's machine or a runner.
    # Allowed as that value in the four files that hold it, and nowhere else: the same password in a
    # fifth file, or another password in one of these, still fails.
    [[rules.allowlists]]
    description = "The compose container's committed local credentials"
    condition = "AND"
    regexTarget = "secret"
    regexes = ['''^localdev$''']
    paths = [
        '''^compose\.yaml$''',
        '''^MyVideoGameList\.Server/appsettings\.Development\.json$''',
        '''^myvideogamelist\.client/e2e/playwright\.config\.ts$''',
        '''^\.github/workflows/ci\.yml$''',
    ]



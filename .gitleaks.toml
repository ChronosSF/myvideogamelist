# What CI's secret scan looks for (ADR 0061): gitleaks' own rules, one rule more, and three findings
# allowed, each by exactly what it is rather than by a file or a rule turned off.
title = "MyVideoGameList"

[extend]
useDefault = true

# The default generic rule wants a value of ten characters or more that looks random, so a real
# connection string with a short or guessable password passes it. This catches the password in any
# connection string or database container's environment, whatever it looks like.
[[rules]]
id = "connection-password"
description = "A password in a connection string or a database container's environment"
regex = '''(?i)(?:\b(?:password|pwd)=|\b(?:postgres_password|pgpassword)\s*[:=]\s*['"]?)([^\s;'"`]+)'''
secretGroup = 1
keywords = ["password=", "pwd=", "postgres_password", "pgpassword"]

    # The local container's credentials, mvgl/localdev, committed on purpose so that a fresh checkout
    # runs with no setup (ADR 0005, 0060). They reach nothing beyond a developer's machine or a runner.
    # Allowed as that value in the four files that hold it, and nowhere else: the same password in a
    # fifth file, or another password in one of these, still fails.
    [[rules.allowlists]]
    description = "The compose container's committed local credentials"
    condition = "AND"
    regexTarget = "secret"
    regexes = ['''^localdev$''']
    paths = [
        '''^compose\.yaml$''',
        '''^MyVideoGameList\.Server/appsettings\.Development\.json$''',
        '''^myvideogamelist\.client/e2e/playwright\.config\.ts$''',
        '''^\.github/workflows/ci\.yml$''',
    ]

# A GitHub token begins a word. The tests' Method_Scenario_Expected names put one of its prefixes
# mid-word wherever a part ends in "ghs" or "ghu" and the next runs past thirty-six characters, as
# GetStatsAsync_NoPlaythroughs_ReportsNothingRatherThanZeroesWithAPlatform does.
[[rules]]
id = "github-app-token"

    [[rules.allowlists]]
    description = "A token prefix in the middle of an identifier"
    regexTarget = "line"
    regexes = ['''[0-9A-Za-z](?:ghu|ghs)_[0-9A-Za-z]{36}''']

# Visual Studio's IIS Express configuration, committed with the rest of .vs/ by baf18587 in March 2026
# and deleted by f339fb45 in August; .vs/ has been ignored since. Its sessionKey attributes are that
# machine's own configuration keys, sealed by a key container that never left it. Allowed in the one
# commit that added the file, so the same path in any later commit is scanned like any other.
[[allowlists]]
description = "The IIS Express configuration committed once with .vs/"
condition = "AND"
commits = ["baf185878b1df1a8afd405204071f015f2cecd27"]
paths = ['''^\.vs/MyVideoGameList\.slnx/config/applicationhost\.config$''']

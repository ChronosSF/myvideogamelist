<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!--
        The source of src/assets/share.png, the image a page is shared with when it has none of its
        own (#139): 1200 by 630, the size Open Graph and the large card are drawn at. render.mjs beside
        it draws this with Chromium, after putting the app's colour tokens on :root, so the image is in
        the app's colours by construction and every colour here is a token. The type is the app's own,
        from the same @fontsource files `src/type.css` serves (ADR 0075).

        Everything that matters stays inside the middle 1200 by 600, because the large card crops the
        image to two to one. It shows the brand and nothing else: no game's art, so no credit is owed
        to anybody, and it says nothing a page might contradict. It is the home page's welcome in
        small: the headline, and the contents list of what the site keeps. The holding page's image
        (holding/share, ADR 0066) goes with that page, and keeps the look it went up with.
    -->
    <style>
        @font-face {
            font-family: 'Archivo Variable';
            font-weight: 100 900;
            font-stretch: 62% 125%;
            src: url('../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2') format('woff2-variations');
        }

        @font-face {
            font-family: 'Schibsted Grotesk Variable';
            font-weight: 400 900;
            src: url('../node_modules/@fontsource-variable/schibsted-grotesk/files/schibsted-grotesk-latin-wght-normal.woff2') format('woff2-variations');
        }

        @font-face {
            font-family: 'DM Mono';
            font-weight: 400;
            src: url('../node_modules/@fontsource/dm-mono/files/dm-mono-latin-400-normal.woff2') format('woff2');
        }

        html,
        body {
            width: 1200px;
            height: 630px;
            margin: 0;
            overflow: hidden;
        }

        body {
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr 380px;
            align-items: center;
            gap: 72px;
            padding: 64px 80px;
            background: var(--color-page);
            font-family: 'Schibsted Grotesk Variable', sans-serif;
        }

        p {
            margin: 0;
        }

        .lockup {
            display: flex;
            align-items: center;
            gap: 18px;
            color: var(--color-fg-strong);
            font-family: 'Archivo Variable', sans-serif;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.01em;
        }

        .lockup svg {
            width: 56px;
            height: 56px;
        }

        /* The logo's own colours, as the navbar draws it. */
        .logo-tile { fill: var(--color-brand-navy); }
        .logo-play { fill: var(--color-brand-light); stroke: var(--color-brand-light); }
        .logo-badge { fill: var(--color-brand-lime); }
        .logo-check { stroke: var(--color-brand-navy); }
        .brand-accent { color: var(--color-brand-lime); }

        /* The welcome's headline, set as the home page sets it: Archivo, wide and heavy. */
        .headline {
            margin-top: 40px;
            color: var(--color-fg-strong);
            font-family: 'Archivo Variable', sans-serif;
            font-stretch: 125%;
            font-size: 64px;
            font-weight: 800;
            line-height: 0.98;
            letter-spacing: -0.02em;
        }

        .accent {
            color: var(--color-primary-400);
        }

        .domain {
            margin-top: 36px;
            color: var(--color-fg-muted);
            font-family: 'DM Mono', monospace;
            font-size: 22px;
            letter-spacing: 0.04em;
        }

        /* The contents list beside it, under a heavy rule, as the welcome has it. */
        .contents {
            border-top: 3px solid var(--color-fg-strong);
        }

        .kicker {
            margin-top: 16px;
            color: var(--color-fg-muted);
            font-family: 'DM Mono', monospace;
            font-size: 15px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .point {
            display: grid;
            grid-template-columns: 64px 1fr;
            align-items: baseline;
            gap: 12px;
            padding: 22px 0;
            border-bottom: 1px solid var(--color-line);
        }

        .number {
            color: var(--color-primary-500);
            font-family: 'Archivo Variable', sans-serif;
            font-stretch: 125%;
            font-size: 40px;
            font-weight: 800;
            line-height: 1;
        }

        .title {
            color: var(--color-fg-strong);
            font-family: 'Archivo Variable', sans-serif;
            font-size: 26px;
            font-weight: 700;
            line-height: 1.15;
        }
    </style>
</head>
<body>
    <div>
        <div class="lockup">
            <svg viewBox="0 0 64 64" aria-hidden="true">
                <!-- The mask's white and black are not colours anybody sees. -->
                <mask id="logo-gap">
                    <rect width="64" height="64" fill="white"/>
                    <rect x="37" y="-3" width="30" height="30" rx="11" fill="black"/>
                </mask>
                <g mask="url(#logo-gap)">
                    <rect class="logo-tile" y="8" width="56" height="56" rx="15"/>
                    <path class="logo-play" d="M21 26 40 36 21 46Z" stroke-width="6" stroke-linejoin="round"/>
                </g>
                <rect class="logo-badge" x="40" width="24" height="24" rx="8"/>
                <path class="logo-check" d="M45.5 12 49.5 16 58 7" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>MyVideoGame<span class="brand-accent">List</span></span>
        </div>
        <p class="headline">Every game you&rsquo;ve played, <span class="accent">in one list</span></p>
        <p class="domain">myvideogamelist.net</p>
    </div>

    <div class="contents" aria-hidden="true">
        <p class="kicker">What it keeps for you</p>
        <div class="point"><span class="number">01</span><span class="title">Your lists</span></div>
        <div class="point"><span class="number">02</span><span class="title">A wishlist that keeps the dates</span></div>
        <div class="point"><span class="number">03</span><span class="title">Your year in numbers</span></div>
    </div>
</body>
</html>
